// 小爱音箱 Pro（OH2P）AirPlay 1 接收端配置
// 完整配置项见 shairport-sync 源码中的 scripts/shairport-sync.conf

general =
{
	name = "小爱音箱"; // 在 iPhone / iPad 的隔空播放列表里显示的名字
	output_backend = "alsa";
	// 系统 mdnsd 的 socket 文件（/var/run/mdnsd）开机后会丢失，dns-sd 无法注册；
	// 而 mdnsd 正被米家中枢 central_lite 使用，不能重启。改用内置的 tinysvcmdns，
	// 与 mdnsd、micont_rtmapp 共用 5353 端口（SO_REUSEADDR）
	mdns_backend = "tinysvcmdns";
	port = 5000;
	udp_port_base = 6001;
	udp_port_range = 10;
	interpolation = "basic";
};

sessioncontrol =
{
	allow_session_interruption = "yes"; // 允许另一台设备直接接管播放
};

alsa =
{
	// default -> plug -> vis(fifo) -> copy -> softvol(mysoftvol) -> dmixer
	// 走 dmix 和小爱自己的声音混音，不独占声卡；
	// 不设置 mixer_control_name，AirPlay 音量只在软件内衰减，不改动小爱的音量
	output_device = "default";
	output_rate = 48000;
	output_format = "S16_LE";
};
